packages:
  - "apps/*"

# Force a single copy of the React type packages across the workspace. Mixed
# 18/19 ReactNode definitions (bigint in 19) will not unify and produce
# spurious "X cannot be used as a JSX component" errors. Both apps run React 19.
overrides:
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.4"

  # Security floors for transitives that cannot be upgraded from a direct
  # workspace dependency without pulling in unrelated major-version changes.
  "@babel/core@<=7.29.0": "7.29.6"
  "picomatch@<2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.5"
  "postcss@<=8.5.22": "8.5.26"
